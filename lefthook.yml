# Design notes: docs/code-notes/lefthook.md
pre-commit:
  parallel: true
  jobs:
    - name: rubocop
      run: bin/rubocop --force-exclusion {staged_files}

    - name: comment-check
      run: bin/comment-check {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: rubocop
      run: bin/rubocop

    - name: comment-check
      run: bin/comment-check

    - name: archspec
      run: bundle exec archspec check

    - name: brakeman
      run: bin/brakeman --no-pager --quiet

    - name: importmap-audit
      run: bin/importmap audit

    - name: rspec
      run: bundle exec rspec --exclude-pattern "system/**/*_spec.rb"
