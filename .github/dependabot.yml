version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  ignore:
    # json 3 takes keyword arguments only and Rails 8.1.3.1 still passes
    # JSON.parse a positional options hash (rails/rails#58601 fixes it on
    # 8-1-stable, unreleased). Lift this once a Rails release carries it.
    - dependency-name: json
      update-types: ["version-update:semver-major"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
