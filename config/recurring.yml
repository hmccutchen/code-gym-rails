production:
  generate_daily_exercises:
    class: EnqueueDueGenerationsJob
    schedule: "0 * * * *"   # The five-nudge cap and PushNudgePlan's quiet period depend on this staying hourly
    description: "Enqueue a generation job for each user whose set is due, and the afternoon nudges"
  sweep_duck_threads:
    class: SweepDuckThreadsJob
    schedule: "17 3 * * *"
    description: "Delete duck threads past DuckThread::KEPT_FOR"
  clear_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    queue: default
    schedule: "12 * * * *"
    description: "Delete finished jobs a day after they finish, since their arguments name users"

development:
  generate_daily_exercises:
    class: EnqueueDueGenerationsJob
    schedule: "*/5 * * * *"
    description: "Enqueue a generation job for each user whose set is due, and the afternoon nudges"
