# Solid Queue recurring tasks (Rails 8 built-in scheduler)
# Runs GenerateDailyExercisesJob every weekday at 8am UTC.
# Adjust the cron expression for your team's timezone if needed.

production:
  generate_daily_exercises:
    class: GenerateDailyExercisesJob
    schedule: "0 * * * *"   # hourly; the job gates each user to 8am in their own zone
    description: "Generate personalized daily Code Gym exercises for all users"

development:
  generate_daily_exercises:
    class: GenerateDailyExercisesJob
    schedule: "*/5 * * * *"    # every 5 min in dev for easy testing
    description: "Generate personalized daily Code Gym exercises for all users"
