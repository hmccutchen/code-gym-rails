# Design notes: docs/code-notes/config/database.md
default: &default
  adapter: postgresql
  encoding: unicode
  # Sized for the judge fan-out on a Solid Queue worker; see lib/boot/database_pool.rb.
  pool: <%= DatabasePool.size(Rails.env) %>

development:
  <<: *default
  database: code_gym_rails_development

# parallel_tests sets TEST_ENV_NUMBER; url outranks DATABASE_URL, so the suffix goes on the url too.
test:
  <<: *default
  database: code_gym_rails_test<%= ENV["TEST_ENV_NUMBER"] %>
<% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %><%= ENV["TEST_ENV_NUMBER"] %>
<% end %>

# Keep exactly one database config: db:migrate runs every one, and an extra would get no DATABASE_URL.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
