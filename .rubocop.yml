# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

inherit_from: .rubocop_todo.yml

AllCops:
  # Replaces the inherited excludes so bin/* is checked; see docs/code-notes/.rubocop.md.
  inherit_mode:
    override:
      - Exclude
  Exclude:
    - ".claude/**/*"
    - ".git/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
    - "**/app/assets/**/*"
    - "db/*schema.rb"
    - "log/**/*"
    - "public/**/*"
    - "storage/**/*"
    - "data/**/*"

require:
  - ./lib/rubocop/cop/code_gym/single_line_comment.rb
  - ./lib/rubocop/cop/code_gym/attached_comment.rb
  - ./lib/rubocop/cop/code_gym/comment_limit.rb

CodeGym/SingleLineComment:
  Enabled: true

CodeGym/AttachedComment:
  Enabled: true

CodeGym/CommentLimit:
  Enabled: true
  Max: 5

Lint/UselessAssignment:
  Enabled: true

Lint/UnusedBlockArgument:
  Enabled: true

Lint/RedundantCopDisableDirective:
  Enabled: true

Metrics/MethodLength:
  Enabled: true
  Max: 25
  CountAsOne: [ heredoc ]
  Include:
    - "app/**/*.rb"

Metrics/ClassLength:
  Enabled: true
  Max: 300
  CountAsOne: [ heredoc ]
  Include:
    - "app/**/*.rb"

Metrics/ModuleLength:
  Enabled: true
  Max: 300
  CountAsOne: [ heredoc ]
  Include:
    - "app/**/*.rb"
